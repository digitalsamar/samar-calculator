<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Samar Calculator</title>
  <meta name="description" content="Samar Calculator — a simple, responsive web calculator." />
  <style>
    :root{
      --bg:#0f1724; --panel:#0b1220; --accent:#4f46e5; --muted:#94a3b8; --glass: rgba(255,255,255,0.03);
      --radius:14px; --btn-radius:10px;
      --shadow: 0 8px 30px rgba(2,6,23,0.6);
      --glass-2: rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg,#071025 0%, #08122a 50%);
      display:flex; align-items:center; justify-content:center; padding:28px; color:#e6eef8;
    }

    .app{
      width:100%; max-width:420px; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);
      border: 1px solid rgba(255,255,255,0.03);
    }

    header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px}
    h1{font-size:18px; margin:0}
    .sub{font-size:12px; color:var(--muted)}

    .screen{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      padding:12px; border-radius:12px; margin-bottom:12px; min-height:84px;
      display:flex; flex-direction:column; justify-content:space-between;
    }
    .display{
      font-size:28px; text-align:right; word-wrap:break-word; hyphens:auto; letter-spacing:0.4px;
    }
    .small{font-size:13px; color:var(--muted); text-align:right}

    .pad{
      display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;
    }
    button.calc-btn{
      padding:16px; border-radius:var(--btn-radius); border:0; background:var(--glass); color:inherit; font-size:18px; cursor:pointer;
      box-shadow: 0 4px 10px rgba(2,6,23,0.4);
    }
    button.calc-btn:active{transform:translateY(1px)}
    button.op{background:linear-gradient(180deg,var(--accent), #3b3adb); color:white}
    button.wide{grid-column: span 2}
    button.accent{background:linear-gradient(180deg,#ef4444,#dc2626); color:white}

    .footer{display:flex; justify-content:space-between; margin-top:12px; gap:8px}
    .history{font-size:13px; color:var(--muted)}

    /* responsive tweaks */
    @media (max-width:420px){.app{padding:14px}}
  </style>
</head>
<body>
  <main class="app" aria-label="Samar Calculator">
    <header>
      <div>
        <h1>Samar Calculator</h1>
        <div class="sub">Simple • Responsive • Keyboard friendly</div>
      </div>
      <div>
        <button id="clearHistory" title="Clear history" class="calc-btn" style="padding:8px 10px;font-size:13px">Clear</button>
      </div>
    </header>

    <section class="screen" role="region" aria-live="polite">
      <div id="formula" class="small" aria-hidden="true"></div>
      <div id="display" class="display" role="textbox" aria-label="Calculator display">0</div>
    </section>

    <section class="pad" role="application" aria-label="Calculator keypad">
      <button class="calc-btn" data-value="7">7</button>
      <button class="calc-btn" data-value="8">8</button>
      <button class="calc-btn" data-value="9">9</button>
      <button class="calc-btn op" data-value="/">÷</button>

      <button class="calc-btn" data-value="4">4</button>
      <button class="calc-btn" data-value="5">5</button>
      <button class="calc-btn" data-value="6">6</button>
      <button class="calc-btn op" data-value="*">×</button>

      <button class="calc-btn" data-value="1">1</button>
      <button class="calc-btn" data-value="2">2</button>
      <button class="calc-btn" data-value="3">3</button>
      <button class="calc-btn op" data-value="-">−</button>

      <button class="calc-btn" data-value="0">0</button>
      <button class="calc-btn" data-value=".">.</button>
      <button class="calc-btn op" id="equals">=</button>
      <button class="calc-btn op" data-value="+">+</button>

      <button class="calc-btn wide accent" id="allClear">AC</button>
    </section>

    <div class="footer">
      <div class="history" id="historyTitle">History</div>
      <div class="sub" id="meta">Made with ❤️</div>
    </div>
  </main>

  <script>
    // Samar Calculator — small, safe evaluation engine and UI logic
    (function(){
      const displayEl = document.getElementById('display');
      const formulaEl = document.getElementById('formula');
      const buttons = Array.from(document.querySelectorAll('.calc-btn'));
      const equalsBtn = document.getElementById('equals');
      const allClear = document.getElementById('allClear');
      const clearHistoryBtn = document.getElementById('clearHistory');

      let current = '';
      let lastResult = null;
      let history = JSON.parse(localStorage.getItem('samar_calc_history') || '[]');

      function refreshDisplay(){
        displayEl.textContent = current === '' ? '0' : current;
        formulaEl.textContent = lastResult !== null ? 'Ans: ' + lastResult : '';
      }

      function pushHistory(entry){
        history.unshift(entry);
        history = history.slice(0,10); // keep last 10
        localStorage.setItem('samar_calc_history', JSON.stringify(history));
        document.getElementById('historyTitle').textContent = 'History ('+history.length+')';
      }

      function safeEvaluate(expr){
        // allow only digits, operators, parentheses and decimal point
        if(!/^[0-9+\-*/().\s]+$/.test(expr)) throw new Error('Invalid characters');
        // prevent consecutive operators like ++ or ** except negative sign handling
        if(/[+\-*/]{2,}/.test(expr.replace(/\s+/g,''))) {
          // allow unary minus by checking pattern
          if(!/^[-]?[0-9().+\-*/\s]+$/.test(expr)) throw new Error('Malformed expression');
        }
        // use Function to evaluate in local scope
        // still be cautious — we validated allowed characters above
        // replace ÷ and × if any
        expr = expr.replace(/÷/g,'/').replace(/×/g,'*');
        // evaluate
        // eslint-disable-next-line no-new-func
        const fn = new Function('return (' + expr + ')');
        const res = fn();
        if(!isFinite(res)) throw new Error('Math error');
        return res;
      }

      buttons.forEach(btn => {
        btn.addEventListener('click', ()=>{
          const v = btn.getAttribute('data-value');
          if(!v) return;
          current += v;
          refreshDisplay();
        });
      });

      equalsBtn.addEventListener('click', ()=>{
        if(current.trim()==='') return;
        try{
          const result = safeEvaluate(current);
          pushHistory({expr: current, result});
          lastResult = result;
          current = String(result);
          refreshDisplay();
        }catch(e){
          displayEl.textContent = 'Error';
          current = '';
        }
      });

      allClear.addEventListener('click', ()=>{
        current = '';
        lastResult = null;
        refreshDisplay();
      });

      clearHistoryBtn.addEventListener('click', ()=>{
        history = [];
        localStorage.removeItem('samar_calc_history');
        document.getElementById('historyTitle').textContent = 'History (0)';
      });

      // keyboard support
      window.addEventListener('keydown', (ev)=>{
        const key = ev.key;
        if(key === 'Enter') { ev.preventDefault(); equalsBtn.click(); return; }
        if(key === 'Backspace') { current = current.slice(0, -1); refreshDisplay(); return; }
        if(key === 'Escape') { allClear.click(); return; }
        if(/^[0-9.+\-*/()]$/.test(key)) {
          current += key; refreshDisplay(); return;
        }
      });

      // initialize
      refreshDisplay();
      document.getElementById('historyTitle').textContent = 'History ('+history.length+')';
    })();
  </script>
</body>
</html>
